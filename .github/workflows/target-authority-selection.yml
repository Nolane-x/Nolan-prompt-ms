name: target-authority-selection

on:
  workflow_dispatch:
    inputs:
      model:
        description: Copilot model identifier or auto
        required: true
        default: auto
        type: string
      reasoning_effort:
        description: Reasoning effort, or default to omit the flag
        required: true
        default: default
        type: choice
        options:
          - default
          - low
          - medium
          - high
          - xhigh

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      MODEL_INPUT: ${{ inputs.model }}
      REASONING_INPUT: ${{ inputs.reasoning_effort }}
    steps:
      - name: Validate frozen selection inputs before generation or inference
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "${MODEL_INPUT//[[:space:]]/}" ]]
          if [ "$MODEL_INPUT" = "auto" ] && [ "$REASONING_INPUT" != "default" ]; then
            echo "Auto model selection does not accept an explicit reasoning-effort flag in this harness." >&2
            exit 1
          fi

  resolve:
    needs: validate
    runs-on: ubuntu-latest
    outputs:
      copilot_version: ${{ steps.version.outputs.copilot_version }}
    steps:
      - id: version
        name: Resolve one Copilot CLI version for preflight and all 24 trials
        shell: bash
        run: |
          set -euo pipefail
          version=$(npm view @github/copilot version)
          test -n "$version"
          echo "copilot_version=$version" >> "$GITHUB_OUTPUT"

  preflight:
    needs: [validate, resolve]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      copilot-requests: write
    env:
      MODEL_ID: ${{ inputs.model }}
      REASONING_EFFORT: ${{ inputs.reasoning_effort }}
      GITHUB_TOKEN: ${{ github.token }}
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the exact Copilot CLI version selected for the experiment
        shell: bash
        run: |
          set -euo pipefail
          npm install -g "@github/copilot@${{ needs.resolve.outputs.copilot_version }}"
          mkdir -p "$RUNNER_TEMP/selection-preflight"
          copilot --version > "$RUNNER_TEMP/selection-preflight/copilot-version.txt"

      - name: Preflight requested model and reasoning before any hidden bundle exists
        shell: bash
        run: |
          set -euo pipefail
          PREFLIGHT_ROOT="$RUNNER_TEMP/selection-preflight"
          PREFLIGHT_WORKSPACE="$PREFLIGHT_ROOT/workspace"
          export COPILOT_HOME="$RUNNER_TEMP/copilot-selection-preflight-home"
          mkdir -p "$PREFLIGHT_WORKSPACE" "$COPILOT_HOME"

          REASONING_ARGS=()
          if [ "$REASONING_EFFORT" != "default" ]; then
            REASONING_ARGS+=("--reasoning-effort=$REASONING_EFFORT")
          fi

          copilot \
            -C "$PREFLIGHT_WORKSPACE" \
            --prompt="Reply with exactly OK. Do not use tools." \
            --model="$MODEL_ID" \
            "${REASONING_ARGS[@]}" \
            --output-format=json \
            --available-tools='bash,create,edit,view,glob,grep' \
            --allow-tool='write,shell(python:*)' \
            --disable-builtin-mcps \
            --no-ask-user \
            --no-custom-instructions \
            --no-experimental \
            --no-remote \
            --no-remote-export \
            --no-auto-update \
            >"$PREFLIGHT_ROOT/copilot-events.jsonl" \
            2>"$PREFLIGHT_ROOT/copilot.stderr.txt"

          python copilot_event_parser.py attest-runtime \
            "$PREFLIGHT_ROOT/copilot-events.jsonl" --json \
            > "$PREFLIGHT_ROOT/runtime-attestation.json"

          python - \
            "$PREFLIGHT_ROOT/runtime-attestation.json" \
            "$MODEL_ID" \
            "$REASONING_EFFORT" <<'PY'
          import json
          import pathlib
          import sys

          attestation = json.loads(pathlib.Path(sys.argv[1]).read_text(encoding="utf-8"))
          requested_model = sys.argv[2]
          requested_effort = sys.argv[3]
          actual_model = attestation.get("model")
          actual_effort = attestation.get("reasoning_effort")

          if requested_model != "auto" and actual_model != requested_model:
              raise SystemExit(
                  f"preflight model mismatch: requested={requested_model!r} actual={actual_model!r}"
              )
          if requested_effort != "default" and actual_effort != requested_effort:
              raise SystemExit(
                  f"preflight reasoning mismatch: requested={requested_effort!r} actual={actual_effort!r}"
              )
          PY

      - name: Preserve model preflight evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: selection-preflight-${{ github.run_id }}
          path: ${{ runner.temp }}/selection-preflight
          if-no-files-found: error
          retention-days: 30

  generate:
    needs: preflight
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.bundle.outputs.matrix }}
    env:
      GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - id: bundle
        name: Generate one frozen hidden bundle with a private execution seed and admit all reference paths
        shell: bash
        run: |
          set -euo pipefail
          if [ "$GITHUB_RUN_ATTEMPT" != "1" ]; then
            echo "Refusing selection rerun before hidden generation; use an exact-bundle repair path." >&2
            exit 1
          fi
          BUNDLE="$RUNNER_TEMP/selection-hidden-bundle"
          seed=$(python - <<'PY'
          import secrets
          print("selection-" + secrets.token_hex(32))
          PY
          )
          python selection_validation.py generate \
            --seed "$seed" \
            --output "$BUNDLE" \
            --json > "$RUNNER_TEMP/selection-generation.json"
          unset seed
          python selection_validation.py admit "$BUNDLE" --json \
            > "$RUNNER_TEMP/selection-admission.json"
          matrix=$(python - "$RUNNER_TEMP/selection-generation.json" <<'PY'
          import json
          import pathlib
          import sys

          payload = json.loads(pathlib.Path(sys.argv[1]).read_text(encoding="utf-8"))
          matrix = payload["matrix"]
          if len(matrix.get("include", [])) != 24:
              raise SystemExit("selection generator did not produce exactly 24 arm trials")
          print(json.dumps(matrix, separators=(",", ":")))
          PY
          )
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

      - name: Preserve the exact admitted hidden bundle
        uses: actions/upload-artifact@v4
        with:
          name: selection-hidden-bundle-${{ github.run_id }}
          path: ${{ runner.temp }}/selection-hidden-bundle
          if-no-files-found: error
          retention-days: 30

      - name: Preserve generation and admission receipts
        uses: actions/upload-artifact@v4
        with:
          name: selection-generation-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/selection-generation.json
            ${{ runner.temp }}/selection-admission.json
          if-no-files-found: error
          retention-days: 30

  trial:
    needs: [generate, resolve]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      copilot-requests: write
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJson(needs.generate.outputs.matrix) }}
    env:
      CASE_ID: ${{ matrix.case_id }}
      ARM: ${{ matrix.arm }}
      MODEL_ID: ${{ inputs.model }}
      REASONING_EFFORT: ${{ inputs.reasoning_effort }}
      HARNESS_ID: github-copilot-selection-v1
      GITHUB_TOKEN: ${{ github.token }}
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download admitted bundle for preparation only
        uses: actions/download-artifact@v4
        with:
          name: selection-hidden-bundle-${{ github.run_id }}
          path: ${{ runner.temp }}/selection-bundle-before

      - name: Prepare isolated agent-visible workspace and exact treatment prompt
        shell: bash
        run: |
          set -euo pipefail
          TRIAL_ROOT="$RUNNER_TEMP/selection-trial"
          BUNDLE_ROOT="$RUNNER_TEMP/selection-bundle-before"
          WORKSPACE="$TRIAL_ROOT/workspace"
          mkdir -p "$TRIAL_ROOT"

          python selection_validation.py prepare \
            "$BUNDLE_ROOT" "$CASE_ID" "$WORKSPACE" --json \
            > "$TRIAL_ROOT/prepare.json"
          python - "$TRIAL_ROOT/prepare.json" "$TRIAL_ROOT/task-prompt.txt" <<'PY'
          import json
          import pathlib
          import sys

          payload = json.loads(pathlib.Path(sys.argv[1]).read_text(encoding="utf-8"))
          pathlib.Path(sys.argv[2]).write_text(payload["prompt"] + "\n", encoding="utf-8")
          PY

          if [ "$ARM" = "R1" ]; then
            TREATMENT_FILE="verified-delta/SKILL.md"
          else
            TREATMENT_FILE="evals/candidates/r1-target-authority.md"
          fi
          printf '%s\n' "$TREATMENT_FILE" > "$TRIAL_ROOT/treatment-file.txt"
          {
            if [ "$ARM" = "R1" ]; then
              cat verified-delta/SKILL.md
            else
              cat evals/candidates/r1-target-authority.md
            fi
            printf '\n\n---\n\n'
            cat "$TRIAL_ROOT/task-prompt.txt"
          } > "$TRIAL_ROOT/prompt.txt"

          # The evaluated agent must never share a filesystem with hidden grader/reference material.
          rm -rf "$BUNDLE_ROOT"
          test ! -e "$BUNDLE_ROOT"

      - name: Install the one pinned Copilot CLI version
        shell: bash
        run: |
          set -euo pipefail
          npm install -g "@github/copilot@${{ needs.resolve.outputs.copilot_version }}"
          copilot --version > "$RUNNER_TEMP/selection-trial/copilot-version.txt"

      - name: Scrub repository checkout before inference
        shell: bash
        run: |
          set -euo pipefail
          find "$GITHUB_WORKSPACE" -mindepth 1 -maxdepth 1 -exec rm -rf -- {} +
          test -z "$(find "$GITHUB_WORKSPACE" -mindepth 1 -maxdepth 1 -print -quit)"
          test ! -e "$RUNNER_TEMP/selection-bundle-before"

      - name: Run isolated frozen-arm trial without hidden bundle or repository present
        shell: bash
        run: |
          set -euo pipefail
          TRIAL_ROOT="$RUNNER_TEMP/selection-trial"
          WORKSPACE="$TRIAL_ROOT/workspace"
          export COPILOT_HOME="$RUNNER_TEMP/copilot-selection-home-$CASE_ID-$ARM"
          mkdir -p "$COPILOT_HOME"
          test ! -e "$RUNNER_TEMP/selection-bundle-before"
          test -z "$(find "$GITHUB_WORKSPACE" -mindepth 1 -maxdepth 1 -print -quit)"

          REASONING_ARGS=()
          if [ "$REASONING_EFFORT" != "default" ]; then
            REASONING_ARGS+=("--reasoning-effort=$REASONING_EFFORT")
          fi

          start_ms=$(date +%s%3N)
          set +e
          copilot \
            -C "$WORKSPACE" \
            --prompt="$(cat "$TRIAL_ROOT/prompt.txt")" \
            --model="$MODEL_ID" \
            "${REASONING_ARGS[@]}" \
            --output-format=json \
            --available-tools='bash,create,edit,view,glob,grep' \
            --allow-tool='write,shell(python:*)' \
            --disable-builtin-mcps \
            --no-ask-user \
            --no-custom-instructions \
            --no-experimental \
            --no-remote \
            --no-remote-export \
            --no-auto-update \
            --share="$TRIAL_ROOT/transcript.md" \
            >"$TRIAL_ROOT/copilot-events.jsonl" \
            2>"$TRIAL_ROOT/copilot.stderr.txt"
          status=$?
          set -e
          end_ms=$(date +%s%3N)
          printf '%s\n' "$status" > "$TRIAL_ROOT/copilot.exit-code.txt"
          printf '%s\n' "$((end_ms - start_ms))" > "$TRIAL_ROOT/wall-time-ms.txt"

          if [ ! -f "$TRIAL_ROOT/transcript.md" ]; then
            {
              echo "# Copilot JSONL events"
              cat "$TRIAL_ROOT/copilot-events.jsonl"
              echo
              echo "# Copilot stderr"
              cat "$TRIAL_ROOT/copilot.stderr.txt"
            } > "$TRIAL_ROOT/transcript.md"
          fi

      - name: Restore trusted repository checkout after inference
        if: always()
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Re-download the exact admitted bundle after inference
        if: always()
        uses: actions/download-artifact@v4
        with:
          name: selection-hidden-bundle-${{ github.run_id }}
          path: ${{ runner.temp }}/selection-bundle-after

      - name: Build actual causal config and immutable arm receipt
        shell: bash
        run: |
          set -euo pipefail
          TRIAL_ROOT="$RUNNER_TEMP/selection-trial"
          WORKSPACE="$TRIAL_ROOT/workspace"
          BUNDLE_ROOT="$RUNNER_TEMP/selection-bundle-after"
          COPILOT_STATUS=$(cat "$TRIAL_ROOT/copilot.exit-code.txt")
          COPILOT_VERSION=$(head -n 1 "$TRIAL_ROOT/copilot-version.txt" | tr -d '\r')
          WALL_TIME_MS=$(cat "$TRIAL_ROOT/wall-time-ms.txt")

          if [ "$COPILOT_STATUS" != "0" ]; then
            python - "$TRIAL_ROOT/infrastructure-error.json" "$COPILOT_STATUS" <<'PY'
          import json
          import pathlib
          import sys

          pathlib.Path(sys.argv[1]).write_text(
              json.dumps(
                  {"kind": "copilot_cli_nonzero_exit", "exit_code": int(sys.argv[2])},
                  indent=2,
                  sort_keys=True,
              ) + "\n",
              encoding="utf-8",
          )
          PY
            echo "Copilot CLI exited nonzero; retaining raw evidence but not creating a behavioral receipt." >&2
            exit 1
          fi

          python copilot_event_parser.py attest-runtime \
            "$TRIAL_ROOT/copilot-events.jsonl" --json \
            > "$TRIAL_ROOT/runtime-attestation.json"

          ACTUAL_MODEL_ID=$(python - "$TRIAL_ROOT/runtime-attestation.json" <<'PY'
          import json
          import pathlib
          import sys

          attestation = json.loads(pathlib.Path(sys.argv[1]).read_text(encoding="utf-8"))
          model = attestation.get("model")
          if not isinstance(model, str) or not model.strip():
              raise SystemExit("runtime attestation missing actual model")
          print(model)
          PY
          )
          printf '%s\n' "$ACTUAL_MODEL_ID" > "$TRIAL_ROOT/actual-model.txt"

          python - \
            "$TRIAL_ROOT/metrics.json" \
            "$WALL_TIME_MS" \
            "$TRIAL_ROOT/runtime-attestation.json" <<'PY'
          import json
          import pathlib
          import sys

          attestation = json.loads(pathlib.Path(sys.argv[3]).read_text(encoding="utf-8"))
          payload = {
              "input_tokens": None,
              "output_tokens": None,
              "tool_calls": attestation["tool_calls"],
              "wall_time_ms": int(sys.argv[2]),
          }
          pathlib.Path(sys.argv[1]).write_text(
              json.dumps(payload, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY

          python - \
            "$TRIAL_ROOT/run-config.json" \
            "$ARM" \
            "$TRIAL_ROOT/runtime-attestation.json" \
            "$MODEL_ID" \
            "$COPILOT_VERSION" \
            "$HARNESS_ID" \
            "$GITHUB_RUN_ID" \
            "$GITHUB_RUN_ATTEMPT" \
            "$CASE_ID" <<'PY'
          import datetime
          import hashlib
          import json
          import os
          import pathlib
          import sys

          (
              output,
              arm,
              attestation_path,
              requested_model_id,
              copilot_version,
              harness_id,
              run_id,
              run_attempt,
              case_id,
          ) = sys.argv[1:]
          attestation = json.loads(pathlib.Path(attestation_path).read_text(encoding="utf-8"))
          actual_model_id = attestation["model"]
          reasoning_effort = attestation["reasoning_effort"]
          tool_set = attestation["tool_set"]
          treatment_path = pathlib.Path(
              "verified-delta/SKILL.md" if arm == "R1" else "evals/candidates/r1-target-authority.md"
          )
          treatment_sha256 = hashlib.sha256(treatment_path.read_bytes()).hexdigest()
          payload = {
              "schema_version": 1,
              "matched": {
                  "prompt_language": "en",
                  "model": {
                      "provider": "github-copilot-cli",
                      "id": actual_model_id,
                      "requested": requested_model_id,
                      "snapshot": "provider-managed-unpinned",
                  },
                  "harness": {
                      "id": harness_id,
                      "version": copilot_version,
                      "runner_os": os.environ.get("RUNNER_OS", "unknown"),
                      "runner_arch": os.environ.get("RUNNER_ARCH", "unknown"),
                  },
                  "tool_set": tool_set,
                  "tool_policy": {
                      "allow": "write,shell(python:*)",
                      "builtin_mcps": False,
                      "custom_instructions": False,
                      "agent_cwd": "isolated-runner-temp-workspace",
                  },
                  "reasoning_effort": reasoning_effort,
                  "sampling_controls": None,
                  "limits": {"job_timeout_minutes": 10},
              },
              "intervention": {
                  "delivery_form": "force-loaded-incumbent" if arm == "R1" else "force-loaded-candidate",
                  "metadata_language": "en",
                  "body_language": "en",
                  "description_variant": "r1" if arm == "R1" else "r1-target-authority",
                  "available_skill_set_sha256": treatment_sha256,
              },
              "trial": {
                  "clean_environment_id": f"gha-{run_id}-attempt-{run_attempt}-{case_id}-{arm}",
                  "trial_id": f"gha-{run_id}-{case_id}-{arm}",
                  "timestamp_utc": datetime.datetime.now(datetime.timezone.utc).isoformat().replace("+00:00", "Z"),
              },
          }
          pathlib.Path(output).write_text(
              json.dumps(payload, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY

          # Grade process claims only from trusted tool events, never from assistant prose.
          python selection_process_evidence.py extract \
            "$BUNDLE_ROOT" \
            "$CASE_ID" \
            "$TRIAL_ROOT/copilot-events.jsonl" \
            "$TRIAL_ROOT/grading-evidence.txt" \
            --json > "$TRIAL_ROOT/process-evidence.json"

          python selection_validation.py record \
            "$BUNDLE_ROOT" \
            "$CASE_ID" \
            "$WORKSPACE" \
            "$TRIAL_ROOT/receipt.json" \
            --arm "$ARM" \
            --model-id "$ACTUAL_MODEL_ID" \
            --harness-id "$HARNESS_ID" \
            --transcript "$TRIAL_ROOT/grading-evidence.txt" \
            --metrics "$TRIAL_ROOT/metrics.json" \
            --run-config "$TRIAL_ROOT/run-config.json" \
            --json > "$TRIAL_ROOT/record-output.json"

          rm -rf "$BUNDLE_ROOT"

      - name: Preserve raw selection arm evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: selection-raw-${{ matrix.case_id }}-${{ matrix.arm }}-${{ github.run_id }}
          path: ${{ runner.temp }}/selection-trial
          if-no-files-found: error
          retention-days: 30

  summarize:
    if: always()
    needs: [generate, trial]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Initialize summary workspace
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/selection-artifacts" "$RUNNER_TEMP/selection-summary"
          echo "summary pending" > "$RUNNER_TEMP/selection-summary/status.txt"

      - name: Download all raw arm evidence
        uses: actions/download-artifact@v4
        with:
          pattern: selection-raw-*-${{ github.run_id }}
          path: ${{ runner.temp }}/selection-artifacts

      - name: Download the exact hidden bundle for out-of-trial grading summary
        uses: actions/download-artifact@v4
        with:
          name: selection-hidden-bundle-${{ github.run_id }}
          path: ${{ runner.temp }}/selection-summary-bundle

      - name: Summarize all frozen pairs and evaluate the preregistered rule fail-closed
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          ARTIFACT_ROOT="$RUNNER_TEMP/selection-artifacts"
          SUMMARY_ROOT="$RUNNER_TEMP/selection-summary"
          BUNDLE_ROOT="$RUNNER_TEMP/selection-summary-bundle"
          mapfile -t receipts < <(find "$ARTIFACT_ROOT" -type f -name receipt.json 2>/dev/null | sort)

          if [ "${#receipts[@]}" -ne 24 ]; then
            python - "$SUMMARY_ROOT/summary-unavailable.json" "${#receipts[@]}" <<'PY'
          import json
          import pathlib
          import sys

          pathlib.Path(sys.argv[1]).write_text(
              json.dumps(
                  {"kind": "missing_selection_receipts", "receipt_count": int(sys.argv[2]), "required": 24},
                  indent=2,
                  sort_keys=True,
              ) + "\n",
              encoding="utf-8",
          )
          PY
            echo "Expected exactly 24 immutable selection arm receipts." >&2
            exit 1
          fi

          python selection_validation.py summarize \
            "$BUNDLE_ROOT" "${receipts[@]}" --json \
            > "$SUMMARY_ROOT/summary.json"

          python - "$SUMMARY_ROOT/summary.json" "$SUMMARY_ROOT/status.txt" <<'PY'
          import json
          import pathlib
          import sys

          payload = json.loads(pathlib.Path(sys.argv[1]).read_text(encoding="utf-8"))
          if payload.get("infrastructure_valid") is not True:
              raise SystemExit("selection summary infrastructure_valid is not true")
          decision = payload.get("decision")
          if not isinstance(decision, dict) or not isinstance(decision.get("passed"), bool):
              raise SystemExit("selection summary is missing a boolean preregistered decision")
          pathlib.Path(sys.argv[2]).write_text(
              ("selection-pass\n" if decision["passed"] else "selection-fail\n"),
              encoding="utf-8",
          )
          PY

      - name: Preserve complete selection summary evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: selection-summary-${{ github.run_id }}
          path: ${{ runner.temp }}/selection-summary
          if-no-files-found: error
          retention-days: 90
