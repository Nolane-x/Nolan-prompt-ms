name: dispatch-semantic-ablation-v1

on:
  push:
    branches:
      - experiment/dispatch-target-authority-ablation-v1

permissions:
  contents: read
  actions: write

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch the two preregistered target-authority ablations
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          for case_id in username-normalization-noop username-normalization-partial; do
            gh workflow run semantic-ablation.yml \
              --repo "$GITHUB_REPOSITORY" \
              --ref main \
              -f case_id="$case_id" \
              -f model=auto \
              -f reasoning_effort=default \
              -f replicate=1
          done
