name: publish-v1.0.0-once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/publish-v1.0.0-once.yml

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: v1.0.0
      RELEASE_TARGET: a7c050d20f23309513e61d7b9221ba38313448dd
      EXPECTED_SKILL_BLOB: ac48f09ab02eca63e014b4c25f86e492ae5559cb
      EXPECTED_SKILL_SHA256: 81f44a454bf00d61a172217864114b71e9792a4247b7f4459633f7b5deb3c5a9
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify release identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object verified-delta/SKILL.md)" = "$EXPECTED_SKILL_BLOB"
          printf '%s  %s\n' "$EXPECTED_SKILL_SHA256" verified-delta/SKILL.md | sha256sum -c -
          test -f README.md
          test -f LICENSE
          grep -q '^MIT License$' LICENSE
          git cat-file -e "$RELEASE_TARGET^{commit}"

      - name: Publish research-distilled v1.0.0
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "$RELEASE_TAG already exists; leaving the existing release unchanged."
            exit 0
          fi

          cat > "$RUNNER_TEMP/release-notes.md" <<'EOF'
          # Verified Delta v1.0.0 — Research-Distilled Release

          **One tiny skill. One hard rule: an agent does not get to call work done until reality agrees.**

          Verified Delta is a 446-word, ~2.9 KB, zero-dependency behavioral controller for AI agents. It targets scope drift, stale state, premature assumptions, unnecessary change, weak causal debugging, and false completion.

          ## What ships

          ```text
          verified-delta/
          └── SKILL.md
          ```

          The runtime is intentionally one file. The research laboratory, tests, receipts, and development harness are not runtime dependencies.

          ## Evidence boundary

          The current runtime was retained through an evidence-first process rather than by accumulating rules. Larger or unsupported changes were rejected when the behavioral evidence did not justify them.

          Fresh matched temporal r3 closed the final targeted pressure boundary with both cases comparable and passing in U0 and U1:

          - `temporal-supersession`: PASS / PASS — `same_pass`, zero comparison issues.
          - `temporal-continuity-control`: PASS / PASS — `same_pass`, zero comparison issues.

          In the single matched supersession replicate, U1 used 6 tool calls / 13.2 s versus U0 13 calls / 28.5 s. This is reported as an observation, **not** as a generalized speedup claim.

          This release does not claim universal benchmark superiority or universal gains across every model and task. Its stronger claim is narrower: the runtime is small, its behavioral boundaries were tested with fail-closed paired evidence, and additional wording was refused when fresh matched evidence did not justify it.

          ## Runtime identity

          - Git blob: `ac48f09ab02eca63e014b4c25f86e492ae5559cb`
          - SHA-256: `81f44a454bf00d61a172217864114b71e9792a4247b7f4459633f7b5deb3c5a9`
          - 446 words
          - 2925 bytes
          - zero runtime dependencies

          ## License

          MIT.
          EOF

          gh release create "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$RELEASE_TARGET" \
            --title "Verified Delta v1.0.0 — Research-Distilled Release" \
            --notes-file "$RUNNER_TEMP/release-notes.md"
