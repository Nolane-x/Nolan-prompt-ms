name: apply-late-bound-runtime-patch

on:
  push:
    branches:
      - fix/execution-recovery-runtime-pair-match-impl
    paths:
      - .github/workflows/apply-late-bound-runtime-patch.yml

permissions:
  contents: write

jobs:
  patch-verify-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify RED ancestry and frozen runtime blobs
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor a809eb14e432662a6a99934d5cd3da4522e6d16f HEAD
          test "$(git rev-parse HEAD:verified-delta/SKILL.md)" = "ac48f09ab02eca63e014b4c25f86e492ae5559cb"
          test "$(git rev-parse HEAD:evals/candidates/r1-target-authority.md)" = "26d93ce346deedccd7186ad5856f849136825ec3"

      - name: Apply minimal late-bound runtime contract
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          workflow_path = Path('.github/workflows/execution-recovery-development.yml')
          tests_path = Path('tests/test_execution_recovery_development_cases.py')

          workflow = workflow_path.read_text(encoding='utf-8')

          old_gate = '''          python - \\
            "$TRIAL_ROOT/seed-attestation.json" \\
            "$TRIAL_ROOT/runtime-attestation.json" <<'PY'\n          import json\n          import pathlib\n          import sys\n\n          seed = json.loads(pathlib.Path(sys.argv[1]).read_text(encoding="utf-8"))\n          attestation = json.loads(pathlib.Path(sys.argv[2]).read_text(encoding="utf-8"))\n          if seed["model"] != attestation["model"]:\n              raise SystemExit("session fork runtime mismatch: model")\n          if seed["reasoning_effort"] != attestation["reasoning_effort"]:\n              raise SystemExit("session fork runtime mismatch: reasoning effort")\n          if seed["tool_set"] != attestation["tool_set"]:\n              raise SystemExit("session fork runtime mismatch: tool set")\n          PY\n\n'''
          if workflow.count(old_gate) != 1:
              raise SystemExit('expected exactly one seed-vs-resume runtime gate')
          workflow = workflow.replace(old_gate, '', 1)

          old_harness = 'HARNESS_ID: github-copilot-execution-recovery-dev-v3-tar-session-fork'
          new_harness = 'HARNESS_ID: github-copilot-execution-recovery-dev-v4-late-bound-runtime'
          if workflow.count(old_harness) != 1:
              raise SystemExit('expected exactly one old harness id')
          workflow = workflow.replace(old_harness, new_harness, 1)

          old_args = '''            "$TRIAL_ROOT/run-config.json" \\
            "$CONDITION" \\
            "$TRIAL_ROOT/runtime-attestation.json" \\
            "$MODEL_ID" \\
'''
          new_args = '''            "$TRIAL_ROOT/run-config.json" \\
            "$CONDITION" \\
            "$TRIAL_ROOT/runtime-attestation.json" \\
            "$TRIAL_ROOT/seed-attestation.json" \\
            "$MODEL_ID" \\
'''
          if workflow.count(old_args) != 1:
              raise SystemExit('expected run-config argument block once')
          workflow = workflow.replace(old_args, new_args, 1)

          old_unpack = '''              output,\n              condition,\n              attestation_path,\n              requested_model_id,\n'''
          new_unpack = '''              output,\n              condition,\n              attestation_path,\n              seed_attestation_path,\n              requested_model_id,\n'''
          if workflow.count(old_unpack) != 1:
              raise SystemExit('expected run-config unpack block once')
          workflow = workflow.replace(old_unpack, new_unpack, 1)

          old_load = '''          attestation = json.loads(pathlib.Path(attestation_path).read_text(encoding="utf-8"))\n          is_u1 = condition == "U1"\n'''
          new_load = '''          attestation = json.loads(pathlib.Path(attestation_path).read_text(encoding="utf-8"))\n          seed_attestation = json.loads(pathlib.Path(seed_attestation_path).read_text(encoding="utf-8"))\n          is_u1 = condition == "U1"\n'''
          if workflow.count(old_load) != 1:
              raise SystemExit('expected attestation load block once')
          workflow = workflow.replace(old_load, new_load, 1)

          old_fork = '''                  "session_fork": {\n                      "protocol": "copilot-local-session-resume-v2-tar",\n                      "session_id": session_id,\n                      "pre_treatment_state_sha256": pre_treatment_state_sha256,\n                      "transport_archive_sha256": transport_archive_sha256,\n                  },\n'''
          new_fork = '''                  "session_fork": {\n                      "protocol": "copilot-local-session-resume-v3-late-bound-runtime",\n                      "session_id": session_id,\n                      "pre_treatment_state_sha256": pre_treatment_state_sha256,\n                      "transport_archive_sha256": transport_archive_sha256,\n                      "seed_runtime": {\n                          "model": seed_attestation["model"],\n                          "reasoning_effort": seed_attestation["reasoning_effort"],\n                          "tool_set": seed_attestation["tool_set"],\n                      },\n                  },\n'''
          if workflow.count(old_fork) != 1:
              raise SystemExit('expected session_fork block once')
          workflow = workflow.replace(old_fork, new_fork, 1)
          workflow_path.write_text(workflow, encoding='utf-8', newline='\n')

          tests = tests_path.read_text(encoding='utf-8')
          old_test = '''        for needle in [\n            '\"remoteExport\": false',\n            'PRE_TREATMENT_STATE_SHA256',\n            'seed[\"model\"] != attestation[\"model\"]',\n            'seed[\"reasoning_effort\"] != attestation[\"reasoning_effort\"]',\n            'seed[\"tool_set\"] != attestation[\"tool_set\"]',\n            '\"session_fork\": {',\n            '\"session_id\": session_id',\n            '\"pre_treatment_state_sha256\": pre_treatment_state_sha256',\n        ]:\n            self.assertIn(needle, workflow)\n        self.assertIn(\"session fork runtime mismatch\", workflow)\n        self.assertIn(\"session fork state hash mismatch\", workflow)\n        self.assertIn(\"if: always()\", workflow)\n'''
          new_test = '''        for needle in [\n            '\"remoteExport\": false',\n            'PRE_TREATMENT_STATE_SHA256',\n            '\"session_fork\": {',\n            '\"session_id\": session_id',\n            '\"pre_treatment_state_sha256\": pre_treatment_state_sha256',\n            '\"seed_runtime\": {',\n            '\"model\": seed_attestation[\"model\"]',\n            '\"reasoning_effort\": seed_attestation[\"reasoning_effort\"]',\n            '\"tool_set\": seed_attestation[\"tool_set\"]',\n        ]:\n            self.assertIn(needle, workflow)\n        self.assertNotIn('seed[\"model\"] != attestation[\"model\"]', workflow)\n        self.assertNotIn('seed[\"reasoning_effort\"] != attestation[\"reasoning_effort\"]', workflow)\n        self.assertNotIn('seed[\"tool_set\"] != attestation[\"tool_set\"]', workflow)\n        self.assertNotIn(\"session fork runtime mismatch\", workflow)\n        self.assertIn(\"session fork state hash mismatch\", workflow)\n        self.assertIn(\"if: always()\", workflow)\n'''
          if tests.count(old_test) != 1:
              raise SystemExit('expected old session-fork contract test once')
          tests = tests.replace(old_test, new_test, 1)
          tests_path.write_text(tests, encoding='utf-8', newline='\n')
          PY

      - name: Verify GREEN before commit
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -v
          python verify.py
          git diff --check
          test "$(git hash-object verified-delta/SKILL.md)" = "ac48f09ab02eca63e014b4c25f86e492ae5559cb"
          test "$(git hash-object evals/candidates/r1-target-authority.md)" = "26d93ce346deedccd7186ad5856f849136825ec3"

      - name: Commit verified production change and remove temporary applier
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-late-bound-runtime-patch.yml
          git add .github/workflows/execution-recovery-development.yml tests/test_execution_recovery_development_cases.py
          changed=$(git diff --cached --name-only | sort)
          expected=$(printf '%s\n' ".github/workflows/apply-late-bound-runtime-patch.yml" ".github/workflows/execution-recovery-development.yml" "tests/test_execution_recovery_development_cases.py" | sort)
          test "$changed" = "$expected"
          git commit -m "fix: late-bind resumed runtime identity"
          git push origin HEAD:fix/execution-recovery-runtime-pair-match-impl
