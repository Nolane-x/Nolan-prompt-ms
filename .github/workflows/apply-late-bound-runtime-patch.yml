name: apply-late-bound-runtime-patch
# applier revision 2

on:
  push:
    branches:
      - fix/execution-recovery-runtime-pair-match-impl
    paths:
      - .github/workflows/apply-late-bound-runtime-patch.yml

permissions:
  contents: write

jobs:
  patch-verify-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 8

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify RED ancestry and frozen runtime blobs
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor a809eb14e432662a6a99934d5cd3da4522e6d16f HEAD
          test "$(git rev-parse HEAD:verified-delta/SKILL.md)" = "ac48f09ab02eca63e014b4c25f86e492ae5559cb"
          test "$(git rev-parse HEAD:evals/candidates/r1-target-authority.md)" = "26d93ce346deedccd7186ad5856f849136825ec3"

      - name: Apply minimal late-bound runtime contract
        shell: bash
        run: |
          set -euo pipefail
          python tools/apply_late_bound_runtime_patch.py

      - name: Verify GREEN before commit
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -v
          python verify.py
          git diff --check
          test "$(git hash-object verified-delta/SKILL.md)" = "ac48f09ab02eca63e014b4c25f86e492ae5559cb"
          test "$(git hash-object evals/candidates/r1-target-authority.md)" = "26d93ce346deedccd7186ad5856f849136825ec3"

      - name: Commit verified production change and remove temporary applier
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-late-bound-runtime-patch.yml tools/apply_late_bound_runtime_patch.py
          git add .github/workflows/execution-recovery-development.yml tests/test_execution_recovery_development_cases.py
          changed=$(git diff --cached --name-only | sort)
          expected=$(printf '%s\n' ".github/workflows/apply-late-bound-runtime-patch.yml" ".github/workflows/execution-recovery-development.yml" "tests/test_execution_recovery_development_cases.py" "tools/apply_late_bound_runtime_patch.py" | sort)
          test "$changed" = "$expected"
          git commit -m "fix: late-bind resumed runtime identity"
          git push origin HEAD:fix/execution-recovery-runtime-pair-match-impl
