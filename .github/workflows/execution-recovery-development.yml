name: execution-recovery-development

on:
  workflow_dispatch:
    inputs:
      case_id:
        description: Fresh execution-recovery development case
        required: true
        type: choice
        options:
          - execution-recovery-required
          - execution-recovery-noop
          - incidental-artifact-cleanup
          - required-artifact-preserved
      model:
        description: Copilot model identifier or auto
        required: true
        default: auto
        type: string
      reasoning_effort:
        description: Reasoning effort, or default to omit the flag
        required: true
        default: default
        type: choice
        options:
          - default
          - low
          - medium
          - high
          - xhigh
      replicate:
        description: Positive replicate number
        required: true
        default: "1"
        type: string

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      REPLICATE_INPUT: ${{ inputs.replicate }}
      MODEL_INPUT: ${{ inputs.model }}
      REASONING_INPUT: ${{ inputs.reasoning_effort }}
    steps:
      - name: Validate dispatch inputs before any Copilot trial
        shell: bash
        run: |
          set -euo pipefail
          [[ "$REPLICATE_INPUT" =~ ^[1-9][0-9]*$ ]]
          [[ -n "${MODEL_INPUT//[[:space:]]/}" ]]
          if [ "$MODEL_INPUT" = "auto" ] && [ "$REASONING_INPUT" != "default" ]; then
            echo "Auto model selection does not accept an explicit reasoning-effort flag in this harness." >&2
            exit 1
          fi

  resolve:
    needs: validate
    runs-on: ubuntu-latest
    outputs:
      copilot_version: ${{ steps.version.outputs.copilot_version }}
    steps:
      - id: version
        name: Resolve one Copilot CLI version for the pair
        shell: bash
        run: |
          set -euo pipefail
          version=$(npm view @github/copilot version)
          test -n "$version"
          echo "copilot_version=$version" >> "$GITHUB_OUTPUT"

  preflight:
    needs: [validate, resolve]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      copilot-requests: write
    outputs:
      locked_model: ${{ steps.lock.outputs.locked_model }}
      locked_reasoning_effort: ${{ steps.lock.outputs.locked_reasoning_effort }}
      locked_tool_set_json: ${{ steps.lock.outputs.locked_tool_set_json }}
    env:
      MODEL_INPUT: ${{ inputs.model }}
      REASONING_INPUT: ${{ inputs.reasoning_effort }}
      GITHUB_TOKEN: ${{ github.token }}
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Initialize neutral runtime-lock workspace
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/execution-recovery-model-lock"
          mkdir -p "$ROOT/workspace"
          printf '%s\n' 'Return READY. Do not modify files and do not solve any repository task.' > "$ROOT/prompt.txt"

      - name: Install pinned Copilot CLI
        shell: bash
        run: |
          set -euo pipefail
          npm install -g "@github/copilot@${{ needs.resolve.outputs.copilot_version }}"
          copilot --version > "$RUNNER_TEMP/execution-recovery-model-lock/copilot-version.txt"

      - id: lock
        name: Select and prove exact runtime lock
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/execution-recovery-model-lock"
          WORKSPACE="$ROOT/workspace"

          SELECT_REASONING_ARGS=()
          if [ "$REASONING_INPUT" != "default" ]; then
            SELECT_REASONING_ARGS+=("--reasoning-effort=$REASONING_INPUT")
          fi

          export COPILOT_HOME="$RUNNER_TEMP/copilot-execution-recovery-preflight-select"
          mkdir -p "$COPILOT_HOME"
          set +e
          copilot \
            -C "$WORKSPACE" \
            --prompt="$(cat "$ROOT/prompt.txt")" \
            --model="$MODEL_INPUT" \
            "${SELECT_REASONING_ARGS[@]}" \
            --output-format=json \
            --available-tools='bash,create,edit,view,glob,grep' \
            --allow-tool='write,shell(python:*)' \
            --disable-builtin-mcps \
            --no-ask-user \
            --no-custom-instructions \
            --no-experimental \
            --no-remote \
            --no-remote-export \
            --no-auto-update \
            > "$ROOT/selected-events.jsonl" \
            2> "$ROOT/selected.stderr.txt"
          selected_status=$?
          set -e
          printf '%s\n' "$selected_status" > "$ROOT/selected.exit-code.txt"
          if [ "$selected_status" != "0" ]; then
            echo "Runtime selection preflight failed before behavioral trials." >&2
            exit 1
          fi

          python copilot_event_parser.py attest-runtime \
            "$ROOT/selected-events.jsonl" --json \
            > "$ROOT/selected-attestation.json"

          readarray -t selected_identity < <(python - "$ROOT/selected-attestation.json" <<'PY'
          import json
          import pathlib
          import sys

          selected = json.loads(pathlib.Path(sys.argv[1]).read_text(encoding="utf-8"))
          model = selected.get("model")
          reasoning = selected.get("reasoning_effort")
          if not isinstance(model, str) or not model.strip():
              raise SystemExit("selected runtime missing model")
          if not isinstance(reasoning, str) or reasoning not in {"low", "medium", "high", "xhigh"}:
              raise SystemExit("selected runtime missing concrete reasoning effort")
          print(model)
          print(reasoning)
          PY
          )
          SELECTED_MODEL="${selected_identity[0]}"
          SELECTED_REASONING="${selected_identity[1]}"
          printf '%s\n' "$SELECTED_MODEL" > "$ROOT/selected-model.txt"
          printf '%s\n' "$SELECTED_REASONING" > "$ROOT/selected-reasoning-effort.txt"

          export COPILOT_HOME="$RUNNER_TEMP/copilot-execution-recovery-preflight-lock"
          mkdir -p "$COPILOT_HOME"
          set +e
          copilot \
            -C "$WORKSPACE" \
            --prompt="$(cat "$ROOT/prompt.txt")" \
            --model="$SELECTED_MODEL" \
            --reasoning-effort="$SELECTED_REASONING" \
            --output-format=json \
            --available-tools='bash,create,edit,view,glob,grep' \
            --allow-tool='write,shell(python:*)' \
            --disable-builtin-mcps \
            --no-ask-user \
            --no-custom-instructions \
            --no-experimental \
            --no-remote \
            --no-remote-export \
            --no-auto-update \
            > "$ROOT/locked-events.jsonl" \
            2> "$ROOT/locked.stderr.txt"
          locked_status=$?
          set -e
          printf '%s\n' "$locked_status" > "$ROOT/locked.exit-code.txt"
          if [ "$locked_status" != "0" ]; then
            echo "Selected runtime cannot be invoked by exact model/reasoning identity; refusing behavioral trials." >&2
            exit 1
          fi

          python copilot_event_parser.py attest-runtime \
            "$ROOT/locked-events.jsonl" --json \
            > "$ROOT/locked-attestation.json"

          python - \
            "$ROOT/selected-attestation.json" \
            "$ROOT/locked-attestation.json" \
            "$ROOT/locked-tool-set.json" \
            "$GITHUB_OUTPUT" <<'PY'
          import json
          import pathlib
          import sys

          selected = json.loads(pathlib.Path(sys.argv[1]).read_text(encoding="utf-8"))
          locked = json.loads(pathlib.Path(sys.argv[2]).read_text(encoding="utf-8"))
          if selected["model"] != locked["model"]:
              raise SystemExit("exact runtime lock mismatch: model")
          if selected["reasoning_effort"] != locked["reasoning_effort"]:
              raise SystemExit("exact runtime lock mismatch: reasoning effort")
          if selected["tool_set"] != locked["tool_set"]:
              raise SystemExit("exact runtime lock mismatch: tool set")

          tool_set_json = json.dumps(locked["tool_set"], separators=(",", ":"))
          pathlib.Path(sys.argv[3]).write_text(tool_set_json + "\n", encoding="utf-8")
          with pathlib.Path(sys.argv[4]).open("a", encoding="utf-8") as output:
              output.write(f"locked_model={locked['model']}\n")
              output.write(f"locked_reasoning_effort={locked['reasoning_effort']}\n")
              output.write(f"locked_tool_set_json={tool_set_json}\n")
          PY

      - name: Preserve runtime-lock evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: execution-recovery-model-lock-${{ github.run_id }}
          path: ${{ runner.temp }}/execution-recovery-model-lock
          if-no-files-found: error
          retention-days: 30

  trial:
    needs: [validate, resolve, preflight]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      copilot-requests: write
    strategy:
      fail-fast: false
      matrix:
        condition: [U0, U1]
    env:
      CASE_ID: ${{ inputs.case_id }}
      CONDITION: ${{ matrix.condition }}
      MODEL_ID: ${{ inputs.model }}
      REASONING_EFFORT: ${{ inputs.reasoning_effort }}
      EXECUTION_MODEL_ID: ${{ needs.preflight.outputs.locked_model }}
      EXECUTION_REASONING_EFFORT: ${{ needs.preflight.outputs.locked_reasoning_effort }}
      LOCKED_TOOL_SET_JSON: ${{ needs.preflight.outputs.locked_tool_set_json }}
      REPLICATE: ${{ inputs.replicate }}
      HARNESS_ID: github-copilot-execution-recovery-dev-v1
      GITHUB_TOKEN: ${{ github.token }}
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Prepare isolated agent-visible workspace and treatment prompt
        shell: bash
        run: |
          set -euo pipefail
          TRIAL_ROOT="$RUNNER_TEMP/execution-recovery-dev"
          WORKSPACE="$TRIAL_ROOT/workspace"
          mkdir -p "$TRIAL_ROOT"
          python execution_recovery_development.py prepare "$CASE_ID" "$WORKSPACE" --json \
            > "$TRIAL_ROOT/prepare.json"
          python - "$TRIAL_ROOT/prepare.json" "$TRIAL_ROOT/task-prompt.txt" <<'PY'
          import json
          import pathlib
          import sys

          payload = json.loads(pathlib.Path(sys.argv[1]).read_text(encoding="utf-8"))
          pathlib.Path(sys.argv[2]).write_text(payload["prompt"] + "\n", encoding="utf-8")
          PY

          if [ "$CONDITION" = "U1" ]; then
            {
              cat verified-delta/SKILL.md
              printf '\n\n---\n\n'
              cat "$TRIAL_ROOT/task-prompt.txt"
            } > "$TRIAL_ROOT/prompt.txt"
          else
            cp "$TRIAL_ROOT/task-prompt.txt" "$TRIAL_ROOT/prompt.txt"
          fi

      - name: Install pinned Copilot CLI
        shell: bash
        run: |
          set -euo pipefail
          npm install -g "@github/copilot@${{ needs.resolve.outputs.copilot_version }}"
          copilot --version > "$RUNNER_TEMP/execution-recovery-dev/copilot-version.txt"

      - name: Run isolated Copilot trial
        shell: bash
        run: |
          set -euo pipefail
          TRIAL_ROOT="$RUNNER_TEMP/execution-recovery-dev"
          WORKSPACE="$TRIAL_ROOT/workspace"
          export COPILOT_HOME="$RUNNER_TEMP/copilot-execution-recovery-$CONDITION"
          mkdir -p "$COPILOT_HOME"

          start_ms=$(date +%s%3N)
          set +e
          copilot \
            -C "$WORKSPACE" \
            --prompt="$(cat "$TRIAL_ROOT/prompt.txt")" \
            --model="$EXECUTION_MODEL_ID" \
            --reasoning-effort="$EXECUTION_REASONING_EFFORT" \
            --output-format=json \
            --available-tools='bash,create,edit,view,glob,grep' \
            --allow-tool='write,shell(python:*)' \
            --disable-builtin-mcps \
            --no-ask-user \
            --no-custom-instructions \
            --no-experimental \
            --no-remote \
            --no-remote-export \
            --no-auto-update \
            --share="$TRIAL_ROOT/transcript.md" \
            > "$TRIAL_ROOT/copilot-events.jsonl" \
            2> "$TRIAL_ROOT/copilot.stderr.txt"
          status=$?
          set -e
          end_ms=$(date +%s%3N)
          printf '%s\n' "$status" > "$TRIAL_ROOT/copilot.exit-code.txt"
          printf '%s\n' "$((end_ms - start_ms))" > "$TRIAL_ROOT/wall-time-ms.txt"

          if [ ! -f "$TRIAL_ROOT/transcript.md" ]; then
            {
              echo "# Copilot JSONL events"
              cat "$TRIAL_ROOT/copilot-events.jsonl"
              echo
              echo "# Copilot stderr"
              cat "$TRIAL_ROOT/copilot.stderr.txt"
            } > "$TRIAL_ROOT/transcript.md"
          fi

      - name: Build actual causal config and immutable receipt
        shell: bash
        run: |
          set -euo pipefail
          TRIAL_ROOT="$RUNNER_TEMP/execution-recovery-dev"
          WORKSPACE="$TRIAL_ROOT/workspace"
          COPILOT_STATUS=$(cat "$TRIAL_ROOT/copilot.exit-code.txt")
          COPILOT_VERSION=$(head -n 1 "$TRIAL_ROOT/copilot-version.txt" | tr -d '\r')
          WALL_TIME_MS=$(cat "$TRIAL_ROOT/wall-time-ms.txt")
          PAIR_ID="gh-${GITHUB_RUN_ID}-${CASE_ID}"

          if [ "$COPILOT_STATUS" != "0" ]; then
            python - "$TRIAL_ROOT/infrastructure-error.json" "$COPILOT_STATUS" <<'PY'
          import json
          import pathlib
          import sys

          pathlib.Path(sys.argv[1]).write_text(
              json.dumps(
                  {"kind": "copilot_cli_nonzero_exit", "exit_code": int(sys.argv[2])},
                  indent=2,
                  sort_keys=True,
              ) + "\n",
              encoding="utf-8",
          )
          PY
            echo "Copilot CLI exited nonzero; preserving raw evidence without behavioral receipt." >&2
            exit 1
          fi

          python copilot_event_parser.py attest-runtime \
            "$TRIAL_ROOT/copilot-events.jsonl" --json \
            > "$TRIAL_ROOT/runtime-attestation.json"

          python - \
            "$TRIAL_ROOT/runtime-attestation.json" \
            "$EXECUTION_MODEL_ID" \
            "$EXECUTION_REASONING_EFFORT" \
            "$LOCKED_TOOL_SET_JSON" <<'PY'
          import json
          import pathlib
          import sys

          attestation = json.loads(pathlib.Path(sys.argv[1]).read_text(encoding="utf-8"))
          expected_model = sys.argv[2]
          expected_reasoning = sys.argv[3]
          expected_tool_set = json.loads(sys.argv[4])
          if attestation["model"] != expected_model:
              raise SystemExit("behavioral runtime drifted from preflight lock: model")
          if attestation["reasoning_effort"] != expected_reasoning:
              raise SystemExit("behavioral runtime drifted from preflight lock: reasoning effort")
          if attestation["tool_set"] != expected_tool_set:
              raise SystemExit("behavioral runtime drifted from preflight lock: tool set")
          PY

          ACTUAL_MODEL_ID=$(python - "$TRIAL_ROOT/runtime-attestation.json" <<'PY'
          import json
          import pathlib
          import sys

          attestation = json.loads(pathlib.Path(sys.argv[1]).read_text(encoding="utf-8"))
          model = attestation.get("model")
          if not isinstance(model, str) or not model.strip():
              raise SystemExit("runtime attestation missing actual model")
          print(model)
          PY
          )

          python - "$TRIAL_ROOT/metrics.json" "$WALL_TIME_MS" "$TRIAL_ROOT/runtime-attestation.json" <<'PY'
          import json
          import pathlib
          import sys

          attestation = json.loads(pathlib.Path(sys.argv[3]).read_text(encoding="utf-8"))
          payload = {
              "input_tokens": None,
              "output_tokens": None,
              "tool_calls": attestation["tool_calls"],
              "wall_time_ms": int(sys.argv[2]),
          }
          pathlib.Path(sys.argv[1]).write_text(
              json.dumps(payload, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY

          python - \
            "$TRIAL_ROOT/run-config.json" \
            "$CONDITION" \
            "$TRIAL_ROOT/runtime-attestation.json" \
            "$MODEL_ID" \
            "$COPILOT_VERSION" \
            "$HARNESS_ID" \
            "$GITHUB_RUN_ID" \
            "$GITHUB_RUN_ATTEMPT" \
            "$CASE_ID" \
            "$REPLICATE" <<'PY'
          import datetime
          import json
          import os
          import pathlib
          import sys

          (
              output,
              condition,
              attestation_path,
              requested_model_id,
              copilot_version,
              harness_id,
              run_id,
              run_attempt,
              case_id,
              replicate,
          ) = sys.argv[1:]
          attestation = json.loads(pathlib.Path(attestation_path).read_text(encoding="utf-8"))
          is_u1 = condition == "U1"
          payload = {
              "schema_version": 1,
              "matched": {
                  "prompt_language": "en",
                  "model": {
                      "provider": "github-copilot-cli",
                      "id": attestation["model"],
                      "requested": requested_model_id,
                      "snapshot": "provider-managed-unpinned",
                  },
                  "harness": {
                      "id": harness_id,
                      "version": copilot_version,
                      "runner_os": os.environ.get("RUNNER_OS", "unknown"),
                      "runner_arch": os.environ.get("RUNNER_ARCH", "unknown"),
                  },
                  "tool_set": attestation["tool_set"],
                  "tool_policy": {
                      "allow": "write,shell(python:*)",
                      "builtin_mcps": False,
                      "custom_instructions": False,
                      "agent_cwd": "isolated-runner-temp-workspace",
                  },
                  "reasoning_effort": attestation["reasoning_effort"],
                  "sampling_controls": None,
                  "limits": {"job_timeout_minutes": 10},
              },
              "intervention": {
                  "delivery_form": "force-loaded-skill" if is_u1 else "none",
                  "metadata_language": "en" if is_u1 else None,
                  "body_language": "en" if is_u1 else None,
                  "description_variant": "current" if is_u1 else None,
                  "available_skill_set_sha256": None,
              },
              "trial": {
                  "clean_environment_id": f"gha-{run_id}-attempt-{run_attempt}-{condition}",
                  "trial_id": f"gha-{run_id}-{case_id}-{condition}-r{replicate}",
                  "timestamp_utc": datetime.datetime.now(datetime.timezone.utc).isoformat().replace("+00:00", "Z"),
              },
          }
          pathlib.Path(output).write_text(
              json.dumps(payload, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY

          python execution_recovery_development.py record \
            "$CASE_ID" \
            "$WORKSPACE" \
            "$TRIAL_ROOT/receipt.json" \
            --condition "$CONDITION" \
            --pair-id "$PAIR_ID" \
            --replicate "$REPLICATE" \
            --model-id "$ACTUAL_MODEL_ID" \
            --harness-id "$HARNESS_ID" \
            --transcript "$TRIAL_ROOT/transcript.md" \
            --metrics "$TRIAL_ROOT/metrics.json" \
            --run-config "$TRIAL_ROOT/run-config.json" \
            --json > "$TRIAL_ROOT/record-output.json"

      - name: Preserve raw development evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: execution-recovery-raw-${{ inputs.case_id }}-${{ matrix.condition }}-r${{ inputs.replicate }}-${{ github.run_id }}
          path: ${{ runner.temp }}/execution-recovery-dev
          if-no-files-found: error
          retention-days: 30

  summarize:
    if: always()
    needs: trial
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Initialize pair summary workspace
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/execution-recovery-pair-artifacts" "$RUNNER_TEMP/execution-recovery-pair-summary"
          echo "summary pending" > "$RUNNER_TEMP/execution-recovery-pair-summary/status.txt"

      - name: Download both raw trial artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: execution-recovery-raw-${{ inputs.case_id }}-*-r${{ inputs.replicate }}-${{ github.run_id }}
          path: ${{ runner.temp }}/execution-recovery-pair-artifacts

      - name: Summarize matched receipts fail-closed
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          PAIR_ROOT="$RUNNER_TEMP/execution-recovery-pair-artifacts"
          SUMMARY_ROOT="$RUNNER_TEMP/execution-recovery-pair-summary"
          mapfile -t receipts < <(find "$PAIR_ROOT" -type f -name receipt.json 2>/dev/null | sort)
          if [ "${#receipts[@]}" -ne 2 ]; then
            echo "Expected exactly two development receipts, found ${#receipts[@]}." >&2
            exit 1
          fi

          python execution_recovery_development.py summarize "${receipts[@]}" --json \
            > "$SUMMARY_ROOT/summary.json"

          python - "$SUMMARY_ROOT/summary.json" <<'PY'
          import json
          import pathlib
          import sys

          payload = json.loads(pathlib.Path(sys.argv[1]).read_text(encoding="utf-8"))
          pairs = payload.get("pairs", [])
          if len(pairs) != 1:
              raise SystemExit("expected exactly one paired summary")
          pair = pairs[0]
          if not pair.get("comparable", False):
              raise SystemExit("paired receipts are not comparable")
          if any(item.get("effect") == "not_comparable" for item in pair.get("replicates", [])):
              raise SystemExit("not_comparable replicate present")
          PY
          echo "summary valid" > "$SUMMARY_ROOT/status.txt"

      - name: Preserve pair summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: execution-recovery-pair-summary-${{ inputs.case_id }}-r${{ inputs.replicate }}-${{ github.run_id }}
          path: ${{ runner.temp }}/execution-recovery-pair-summary
          if-no-files-found: error
          retention-days: 30
