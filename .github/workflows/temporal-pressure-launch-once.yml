name: temporal-pressure-launch-once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/temporal-pressure-launch-once.yml

permissions:
  contents: read

jobs:
  sdk-model-catalog-probe:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      copilot-requests: write
    env:
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - name: List entitlement-aware models through Copilot SDK without inference
        shell: bash
        run: |
          set -euo pipefail
          npm install -g "@github/copilot@1.0.83"
          ROOT="$RUNNER_TEMP/sdk-model-catalog-probe"
          mkdir -p "$ROOT/sdk" "$ROOT/home"
          export COPILOT_HOME="$ROOT/home"
          cat > "$COPILOT_HOME/settings.json" <<'JSON'
          {
            "remoteExport": false
          }
          JSON
          npm install --prefix "$ROOT/sdk" @github/copilot-sdk
          export COPILOT_CLI_PATH="$(command -v copilot)"
          export NODE_PATH="$ROOT/sdk/node_modules"
          cd "$ROOT/sdk"
          node --input-type=module <<'NODE'
          import { CopilotClient } from "@github/copilot-sdk";

          const client = new CopilotClient({
            cliPath: process.env.COPILOT_CLI_PATH,
            gitHubToken: process.env.GITHUB_TOKEN,
            useLoggedInUser: false,
            logLevel: "error",
          });
          try {
            await client.start();
            const models = await client.listModels();
            console.log(JSON.stringify(models.map((m) => ({
              id: m.id,
              name: m.name,
              policy: m.policy ?? null,
              billing: m.billing ?? null,
              capabilities: m.capabilities ?? null,
            })), null, 2));
            if (!Array.isArray(models) || models.length === 0) {
              throw new Error("models.list returned no models");
            }
          } finally {
            await client.stop();
          }
          NODE
