name: temporal-pressure-launch-once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/temporal-pressure-launch-once.yml

permissions:
  contents: read

jobs:
  interactive-model-picker-probe:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      copilot-requests: write
    env:
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - name: Capture entitlement-aware /model picker without running a task
        shell: bash
        run: |
          set -euo pipefail
          npm install -g "@github/copilot@1.0.83"
          ROOT="$RUNNER_TEMP/model-picker-probe"
          export COPILOT_HOME="$ROOT/copilot-home"
          mkdir -p "$COPILOT_HOME" "$ROOT/workspace"
          cat > "$COPILOT_HOME/settings.json" <<'JSON'
          {
            "remoteExport": false
          }
          JSON
          set +e
          printf '/model\n' | timeout -s INT 12s script -qefc "copilot -C '$ROOT/workspace' --disable-builtin-mcps --no-custom-instructions --no-experimental --no-remote --no-remote-export --no-auto-update" "$ROOT/typescript.txt"
          status=$?
          set -e
          echo "probe_exit_code=$status"
          echo '=== MODEL PICKER TYPESCRIPT ==='
          cat -v "$ROOT/typescript.txt"
          exit 0
