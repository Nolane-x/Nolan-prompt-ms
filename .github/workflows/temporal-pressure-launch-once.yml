name: temporal-pressure-launch-once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/temporal-pressure-launch-once.yml

permissions:
  contents: read

jobs:
  required-model-policy-probe:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      copilot-requests: write
    env:
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - name: Resolve first account-accessible authored model fail-closed
        shell: bash
        run: |
          set -euo pipefail
          npm install -g "@github/copilot@1.0.83"
          ROOT="$RUNNER_TEMP/required-model-policy-probe"
          export COPILOT_HOME="$ROOT/copilot-home"
          mkdir -p "$COPILOT_HOME/agents" "$ROOT/workspace"
          cat > "$COPILOT_HOME/settings.json" <<'JSON'
          {
            "remoteExport": false
          }
          JSON
          cat > "$COPILOT_HOME/agents/model-lock.agent.md" <<'AGENT'
          ---
          name: model-lock
          description: Neutral capability probe with a required authored model policy.
          models:
            - gpt-5.3-codex
            - claude-haiku-4.5
            - gpt-5.4
            - gpt-5.4-mini
            - gemini-3.5-flash
            - gemini-3.6-flash
          modelPolicy: required
          tools: []
          ---
          Return only the requested literal marker. Do not use tools.
          AGENT
          set +e
          copilot \
            -C "$ROOT/workspace" \
            --agent=model-lock \
            --prompt='Return exactly MODEL_READY.' \
            --output-format=json \
            --disable-builtin-mcps \
            --no-ask-user \
            --no-custom-instructions \
            --no-experimental \
            --no-remote \
            --no-remote-export \
            --no-auto-update \
            > "$ROOT/events.jsonl" \
            2> "$ROOT/stderr.txt"
          status=$?
          set -e
          echo "probe_exit_code=$status"
          echo '=== STDERR ==='
          cat "$ROOT/stderr.txt"
          echo '=== EVENTS ==='
          cat "$ROOT/events.jsonl"
          exit "$status"
