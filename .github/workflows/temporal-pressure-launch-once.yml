name: temporal-pressure-launch-once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/temporal-pressure-launch-once.yml

permissions:
  contents: read

jobs:
  model-surface-probe:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect exact Copilot CLI model surface without inference
        shell: bash
        run: |
          set -euo pipefail
          npm install -g "@github/copilot@1.0.83"
          copilot --version
          echo '=== COPILOT HELP ==='
          copilot --help
