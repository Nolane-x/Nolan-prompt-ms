name: temporal-pressure-launch-once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/temporal-pressure-launch-once.yml

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch preregistered Auto-router total-system replicate 3
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run execution-recovery-development.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main \
            -f case_id=temporal-supersession \
            -f model=auto \
            -f reasoning_effort=default \
            -f replicate=3

          gh workflow run execution-recovery-development.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main \
            -f case_id=temporal-continuity-control \
            -f model=auto \
            -f reasoning_effort=default \
            -f replicate=3
